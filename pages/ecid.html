<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل ECID - Tech Services</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; }
        .container { max-width: 700px; margin: 60px auto; padding: 24px; background: rgba(255,255,255,0.08); border-radius: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #111827; color: #fff; }
        button { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; padding: 12px 18px; border-radius: 10px; cursor: pointer; }
        .result { margin-top: 16px; padding: 12px; border-radius: 10px; background: #1f2937; display: none; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>تسجيل ECID</h1>
        <p>أدخل ECID أو الرقم التعريفي للجهاز وسيتم تسجيله في نظامنا.</p>

        <form id="ecidForm">
            <div class="form-group">
                <label for="ecid">ECID</label>
                <input id="ecid" name="ecid" placeholder="أدخل ECID" required>
            </div>
            <button type="submit">حفظ ECID</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        function getDeviceInfo() {
            const nav = navigator;
            const screen = window.screen || {};
            const ua = nav.userAgent || '';
            const userAgentData = nav.userAgentData || {};
            const brands = Array.isArray(userAgentData.brands) ? userAgentData.brands.map(b => b.brand).join(', ') : '';

            let deviceModel = 'غير محدد';
            if (userAgentData.mobile !== undefined) {
                deviceModel = userAgentData.mobile ? 'جهاز محمول' : 'جهاز سطح المكتب';
            } else if (/iPhone/i.test(ua)) {
                deviceModel = 'iPhone';
            } else if (/iPad/i.test(ua)) {
                deviceModel = 'iPad';
            } else if (/Android/i.test(ua)) {
                deviceModel = 'Android';
            }

            return {
                deviceModel,
                browser: brands || (ua.includes('Chrome') ? 'Chrome' : ua.includes('Firefox') ? 'Firefox' : 'Other'),
                os: userAgentData.platform || nav.platform || 'Unknown',
                userAgent: ua,
                platform: nav.platform || 'Unknown',
                language: nav.language || 'Unknown',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                screen: `${screen.width || 0}x${screen.height || 0}`,
                colorDepth: screen.colorDepth || 0,
                cookieEnabled: nav.cookieEnabled,
                online: nav.onLine,
                hardwareConcurrency: nav.hardwareConcurrency || 0,
                deviceMemory: nav.deviceMemory || 0,
                maxTouchPoints: nav.maxTouchPoints || 0,
                isMobile: /Mobi|Android|iPhone|iPad/i.test(ua)
            };
        }

        document.getElementById('ecidForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultBox = document.getElementById('result');
            const payload = {
                ecid: document.getElementById('ecid').value.trim(),
                deviceInfo: getDeviceInfo()
            };

            resultBox.style.display = 'block';
            resultBox.className = 'result';
            resultBox.innerHTML = 'جاري الإرسال...';

            try {
                const response = await fetch('/api/ecid/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const text = await response.text();
                let data = {};
                try {
                    data = text ? JSON.parse(text) : {};
                } catch (parseError) {
                    data = { message: text || 'لا توجد استجابة من الخادم' };
                }

                if (response.ok && data.success) {
                    const telegramMessage = data.telegram?.success
                        ? '✅ تم إرسال الإشعار إلى Telegram بنجاح'
                        : '⚠️ لم يصل الإشعار إلى Telegram: ' + (data.telegram?.message || 'غير معروف');

                    resultBox.className = 'result success';
                    resultBox.innerHTML = 'تم تسجيل ECID بنجاح. رقم التسجيل: ' + (data.recordId || '—') + '<br>الرسالة: ' + (data.message || 'تم الحفظ بنجاح') + '<br>' + telegramMessage;
                } else {
                    resultBox.className = 'result error';
                    resultBox.innerHTML = 'فشل التسجيل<br>الحالة: ' + response.status + '<br>الرسالة: ' + (data.message || 'حدث خطأ غير متوقع');
                }
            } catch (error) {
                resultBox.className = 'result error';
                resultBox.innerHTML = 'حدث خطأ أثناء الإرسال<br>تفاصيل: ' + (error.message || 'غير معروف');
            }
        });
    </script>
</body>
</html>
